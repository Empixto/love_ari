<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Do you love me?</title>

    <!-- Archivo de estilos -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- PANTALLA 1: Pregunta romántica -->
    <main id="pantalla-pregunta" class="pantalla activa">

        <section class="tarjeta" id="tarjeta">

            <h1>Tu me amas bebe?</h1>

            <!-- GIF de Inicio optimizado -->
            <div class="contenedor-gif">
                <img src="https://media4.giphy.com/media/BMVS53dkX8pYaR9IMD/giphy.gif" alt="Ositos tiernos" class="gif-imagen">
            </div>

            <div class="botones">
                <button id="boton-si" class="boton boton-si">
                    SI
                </button>

                <button id="boton-no" class="boton boton-no">
                    NO
                </button>
            </div>

        </section>

    </main>

    <!-- PANTALLA 2: Respuesta romántica -->
    <main id="pantalla-final" class="pantalla pantalla-final">

        <div class="corazones" id="corazones" aria-hidden="true"></div>

        <section class="mensaje-final">

            <h1>Lo sabia!!!! ❤️</h1>

            <!-- GIF Final optimizado -->
            <div class="contenedor-gif">
                <img src="https://media2.giphy.com/media/u62ibpUyRSvJ0PyXJU/giphy.gif" alt="Gatito feliz" class="gif-imagen">
            </div>

            <p>Yo te amo muchisimo mas amorcito!! ❤️❤️❤️</p>

        </section>

    </main>

    <!-- Archivo de interacciones -->
    <script src="script.js"></script>

</body>
</html>
